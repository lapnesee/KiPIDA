name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-contract:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        # wxPython is required, not optional: test_i18n shells out to a
        # subprocess that imports wx and asserts on its exit code, so without
        # it that test fails rather than skips. Installing it also lets the
        # UI-boundary tests actually run instead of skipping, which is the
        # point of having them.
        run: >-
          python -m pip install
          numpy scipy shapely matplotlib threadpoolctl kicad-python wxPython
      - name: Compile Python sources
        run: python -m compileall -q -x '[\\/](\.runtime|\.venv)[\\/]' .
      - name: Run test suite
        run: python -m unittest discover -s tests -q

  universal-fixtures-linux:
    # docs/plan-universalite.md 6.3: reading projects, the project context and
    # the schematic rules on a case-sensitive filesystem with "/" separators,
    # from synthetic fixtures only. wxPython has no Linux wheel, so the
    # UI-bound tests stay with the Windows job; these modules import no wx.
    # The corpus harness (validation/ingest_corpus.py) needs installed KiCad
    # demos and is run by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          numpy scipy shapely matplotlib threadpoolctl kicad-python
      - name: Run the universality fixtures
        run: >-
          python -m unittest -q
          tests.test_ingest_board_reader tests.test_ingest_design_model
          tests.test_ingest_multiboard tests.test_ingest_netlist_builder
          tests.test_ingest_project_resolver tests.test_ingest_schematic_reader
          tests.test_ingest_sexpr tests.test_schematic_hierarchy
          tests.test_schematic_instances tests.test_file_format
          tests.test_project_context tests.test_zeo_container
          tests.test_rules_schematic tests.test_declarations
          tests.test_rail_discovery tests.test_differential_discovery
          tests.test_saved_board_footprints tests.test_campaign_wiring
          tests.test_emc_analyzer
